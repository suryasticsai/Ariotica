name: Ariotica Self-Evolve (Darwin Engine)

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:
    inputs:
      focus:
        description: 'What should Ariotica focus on? (Leave empty for auto-analysis)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Reclaim disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # 2. Synthesize the proposal
      - name: Generate Evolution Proposal
        id: evolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          RUN_ID: ${{ github.run_id }}
          EVOLVE_FOCUS: ${{ inputs.focus || 'auto' }}
        run: node lib/evolve.js

      # 3. Commit the new proposal files
      - name: Commit Proposals
        if: success()
        run: |
          git config user.name "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add proposals/
          # [skip ci] prevents this push from triggering the Generate Project workflow
          git diff --staged --quiet || git commit -m "docs: new evolution proposal [skip ci]"
          git pull --rebase
          git push

      # 4. Save Artifacts for offline review
      - name: Upload Proposals Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-proposals-${{ github.run_id }}
          path: proposals/
          retention-days: 14

      # 5. Generate Job Summary
      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🧬 Ariotica Self-Evolution Report" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Focus |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | \`${{ inputs.focus || 'auto-analysis' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Check your GitHub Issues for a new \`[PROPOSAL]\`." >> $GITHUB_STEP_SUMMARY
            echo "2. Review the code in the \`proposals/\` folder." >> $GITHUB_STEP_SUMMARY
            echo "3. If you like it, copy it to \`lib/plugins/\` and close the issue." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ The AI failed to synthesize a valid proposal. Check the logs." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY