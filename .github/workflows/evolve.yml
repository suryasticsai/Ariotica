name: Ariotica Self-Evolve (Darwin Engine)

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:
    inputs:
      focus:
        description: 'What should Ariotica focus on? (Leave empty for auto-analysis)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-evolve
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Evolution Proposal
        id: evolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

          # Optional overrides to control the AI model race dynamically
          PROVIDER_ORDER: ${{ vars.PROVIDER_ORDER }}
          RACE_SIZE: ${{ vars.RACE_SIZE }}
          NEMOTRON_MODEL: ${{ vars.NEMOTRON_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}

          RUN_ID: ${{ github.run_id }}
          EVOLVE_FOCUS: ${{ inputs.focus || 'auto' }}
        run: node lib/evolve.js

      - name: Commit Proposals and Plugins
        if: success()
        run: |
          # Standard GitHub Actions Bot Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Ensure the plugins directory exists so git add doesn't fail
          mkdir -p lib/plugins proposals
          
          # Stage both proposals and the newly compiled plugins
          git add proposals/ lib/plugins/
          
          # Check if there's anything to commit
          if git diff --staged --quiet; then
            echo "No new proposals or plugins generated."
            exit 0
          fi
          
          git commit -m "docs: new evolution proposal and plugin [skip ci]"
          
          # Retry logic for rebase/push in case main branch is active
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q && echo "Proposals and plugins pushed successfully!" && exit 0
            echo "Push failed (attempt $i/3). Retrying in 3s..."
            sleep 3
          done
          
          echo "Failed to push after 3 retries."
          exit 1

      - name: Upload Proposals and Plugins Artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: evolution-artifacts-${{ github.run_id }}
          path: |
            proposals/
            lib/plugins/
          retention-days: 14

      - name: Generate Job Summary
        if: always()
        env:
          FOCUS: ${{ inputs.focus || 'auto-analysis' }}
          STATUS: ${{ job.status }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "## 🧬 Ariotica Self-Evolution Report" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Focus |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | \`$FOCUS\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$STATUS" = "success" ]; then
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the generated markdown explanation in the \`proposals/\` folder." >> $GITHUB_STEP_SUMMARY
            echo "2. Check the newly installed plugin in the \`lib/plugins/\` folder." >> $GITHUB_STEP_SUMMARY
            echo "3. The plugin will automatically run on the next app build. You don't need to do anything else!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ The AI failed to synthesize a valid proposal. Check the logs below for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Run Logs](https://github.com/$OWNER/$REPO/actions/runs/$RUN_ID)" >> $GITHUB_STEP_SUMMARY