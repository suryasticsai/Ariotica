name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        type: string
        required: true
      prompt:
        type: string
        required: true
      mode:
        type: choice
        options: [create, improve, fix, audit, delete]
        default: create
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-${{ github.event.issue.number || inputs.project || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[BUILD]')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[BUILD]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Knowledge Index
        run: node build-index.js

      - name: Run Agent Unit Tests
        run: npm test

      - name: Generate App with AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROVIDER_ORDER: ${{ vars.PROVIDER_ORDER }}
          RACE_SIZE: ${{ vars.RACE_SIZE }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: node generate.js

      - name: Make Apps Installable (PWA)
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const projectsDir = 'projects';
          if (!fs.existsSync(projectsDir)) process.exit(0);

          const folders = fs.readdirSync(projectsDir).filter(f => fs.statSync(path.join(projectsDir, f)).isDirectory());
          
          for (const folder of folders) {
            const dir = path.join(projectsDir, folder);
            const htmlPath = path.join(dir, 'index.html');
            if (!fs.existsSync(htmlPath)) continue;

            const manifest = {
              name: folder.replace(/-/g, ' ').toUpperCase(),
              short_name: folder,
              start_url: ".",
              display: "standalone",
              background_color: "#0b1410",
              theme_color: "#5ab552",
              icons: [{
                src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>",
                sizes: "512x512",
                type: "image/svg+xml"
              }]
            };
            fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(manifest, null, 2));

            const sw = `
              const CACHE = 'ariotica-v1';
              self.addEventListener('install', (e) => {
                e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./', './index.html', './style.css', './script.js'])));
              });
              self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
              });
            `;
            fs.writeFileSync(path.join(dir, 'sw.js'), sw);

            let html = fs.readFileSync(htmlPath, 'utf8');
            
            if (!html.includes('manifest.json')) {
              html = html.replace('</head>', `  <link rel="manifest" href="manifest.json">\n  <meta name="theme-color" content="#5ab552">\n</head>`);
            }
            
            if (!html.includes('sw.js')) {
              const swRegister = `
              <script>
                if ('serviceWorker' in navigator) {
                  window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
                  });
                }
              </script>
              </body>`;
              html = html.replace('</body>', swRegister);
            }

            fs.writeFileSync(htmlPath, html);
            console.log(`✅ PWA enabled for: ${folder}`);
          }
          EOF

      - name: Commit PWA updates
        run: |
          git config user.name "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add projects/
          git diff --staged --quiet || git commit -m "chore: make generated apps installable (PWA)"
          git push

      - name: Upload Generated App Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariotica-app-${{ github.run_id }}
          path: |
            projects/
            receipts/
          retention-days: 7