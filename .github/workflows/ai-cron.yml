name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug (folder name under projects/)'
        type: string
        required: true
      prompt:
        description: 'Instructions (optional for revert/delete/leaderboard/ask/skills)'
        type: string
        required: false
        default: ''
      mode:
        description: 'Operation mode'
        type: choice
        options:
          - create
          - improve
          - fix
          - audit
          - delete
          - revert
          - skill
          - skills
          - inspire
          - evolve
          - ask
          - leaderboard
        default: create
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-${{ github.event.issue.number || inputs.project || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SECURITY GATE: Only trusted users can trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       startsWith(github.event.issue.title, '[BUILD]') && 
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && 
       !github.event.issue.pull_request &&
       startsWith(github.event.issue.title, '[BUILD]') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '[improve]') ||
        contains(github.event.comment.body, '[fix]') ||
        contains(github.event.comment.body, '[audit]') ||
        contains(github.event.comment.body, '[delete]') ||
        contains(github.event.comment.body, '[revert]') ||
        contains(github.event.comment.body, '[ask]') ||
        contains(github.event.comment.body, '[skill]') ||
        contains(github.event.comment.body, '[skills]') ||
        contains(github.event.comment.body, '[inspire]') ||
        contains(github.event.comment.body, '[evolve]') ||
        contains(github.event.comment.body, '[leaderboard]')))

    steps:
      # 1. Reclaim disk space on the runner (avoids ENOSPC on long builds)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Checkout
        uses: actions/checkout@v4

      # 2. INSTANT FEEDBACK: Add reaction and post comment before heavy lifting
      - name: Quick Acknowledge
        id: quick_ack
        if: github.event_name == 'issue_comment' || github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            if (issueNumber) {
              // Add 👀 reaction if it's a comment
              if (context.eventName === 'issue_comment') {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                }).catch(() => {});
              }
              
              // Drop the initial status comment
              const body = `⏳ **Ariotica is spinning up...**\n\nFetching models, warming up the engines, and preparing to work on this. Stand by...`;
              const res = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
              
              // Export the comment ID so generate.js can edit it
              core.setOutput('comment_id', res.data.id);
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Cache npm downloads (falls back gracefully if no lockfile)
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 4. Pre-flight: catch syntax errors before spending API tokens
      - name: Validate Agent Code
        run: node --check generate.js

      # 5. Run the agent
      #    generate.js commits atomically via the Git Trees API and then
      #    `git reset --hard origin/main`, so HEAD here reflects the push.
      - name: Generate App with AI
        id: run_agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          QUICK_ACK_ID: ${{ steps.quick_ack.outputs.comment_id }}
        run: |
          node generate.js
          echo "NEW_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Rebuild Knowledge Index
        run: node build-index.js

      - name: Commit Knowledge Index
        run: |
          git config user.name "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add knowledge/index.json
          git diff --staged --quiet || git commit -m "chore: rebuild knowledge index"
          git pull --rebase
          git push

      # 6. Upload everything that matters for offline inspection:
      #    the built apps, their receipts, the cost ledger, and the knowledge index
      - name: Upload Generated Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariotica-build-${{ github.run_id }}
          path: |
            projects/
            receipts/
            analytics/
            knowledge/
          retention-days: 7

      # 7. Job summary — mode-aware
      - name: Generate Job Summary
        if: always()
        run: |
          MODE="${{ inputs.mode }}"
          PROJECT="${{ inputs.project }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE="https://$OWNER.github.io/$REPO/projects/$PROJECT/"

          echo "## 🤖 Ariotica Build Report" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Project | Mode |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | \`$PROJECT\` | \`$MODE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case "$MODE" in
            ask|skill|skills|evolve|leaderboard)
              echo "🔎 **Mode:** \`$MODE\` — see the issue thread for the result." >> $GITHUB_STEP_SUMMARY
              ;;
            delete)
              echo "🗑 **Deleted:** \`$PROJECT\`" >> $GITHUB_STEP_SUMMARY
              ;;
            revert)
              echo "↩️ **Reverted:** \`$PROJECT\` — see the issue thread for details." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "[📂 View the Live App]($BASE)" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "[📂 View the Live App]($BASE)" >> $GITHUB_STEP_SUMMARY
              ;;
          esac