name: Generate Project

# One click, no console, no token pasting:
#   GitHub -> this repo -> Actions -> "Generate Project" -> Run workflow
#   fill in the project name + what to build, press the green button.
# Result: projects/<project>_v<N>.html  (N goes up by one every run)
#
# Every generated project is enforced to be PURE VANILLA JS:
#   - single index.html, inline <style> + <script>
#   - no frameworks, no CDNs, no bundlers, no external fetch()
#   - validator rejects output that violates the rules and retries.
#
# Code generation uses your grishtesync-backend repo (ai_client.py) with your
# Groq key. One-time setup:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: GROQ_API_KEY   Value: your key from console.groq.com
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name (e.g. todo-app). Same name again = next version'
        type: string
        required: true
      prompt:
        description: 'What should it build? (vanilla JS only, e.g. a todo app with dark mode and filters)'
        type: string
        required: true
      improve:
        description: 'Improve the latest version of this project instead of starting fresh'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: generate-project
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out grishtesync-backend (code-gen engine)
        uses: actions/checkout@v4
        with:
          repository: suryasticsai/grishtesync-backend
          path: backend-src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate project
        id: gen
        env:
          PROJECT: ${{ inputs.project }}
          PROMPT: ${{ inputs.prompt }}
          IMPROVE: ${{ inputs.improve }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PYEOF'
          import os, re, sys, json, time, html as H
          from datetime import datetime, timezone
          from pathlib import Path

          SUMMARY = os.environ.get('GITHUB_STEP_SUMMARY', os.devnull)

          def fail(msg):
              print('ERROR: ' + msg)
              with open(SUMMARY, 'a', encoding='utf-8') as f:
                  f.write('### ❌ Generation failed\n\n' + msg + '\n')
              sys.exit(1)

          # =========================================================
          # VANILLA JS ENFORCEMENT
          # =========================================================
          VANILLA_JS_RULES = """\
          HARD CONSTRAINTS - the output MUST be a pure vanilla JavaScript single-page app.
          - ONE single index.html file. Inline ALL CSS inside a <style> tag and ALL JavaScript inside a <script> tag.
          - Vanilla JavaScript only (ES2017+). No frameworks, no libraries, no transpilers, no build step, no bundlers.
          - FORBIDDEN frameworks/libraries: React, Preact, Vue, Svelte, Solid, Angular, Alpine.js, htmx, jQuery, Bootstrap, Tailwind, Bulma, Materialize, Lit, Stencil, Ember, Backbone, Knockout, Mithril, Stimulus, Turbo.
          - FORBIDDEN: any external <script src="http..."> or <link rel="stylesheet" href="http..."> (no unpkg, jsdelivr, cdnjs, esm.sh, skypack, esm.run, or any other CDN).
          - FORBIDDEN: ES module `import` / `export` statements, `require(...)`, or any module bundler config.
          - FORBIDDEN: runtime network calls (fetch/XHR to external APIs). The app must work fully offline.
          - FORBIDDEN: external image URLs. Use inline SVG, emoji, or CSS shapes only.
          - Fonts: system font stack only (system-ui, -apple-system, Segoe UI, sans-serif, Georgia, ui-monospace, Menlo).
          - Use only browser APIs: DOM, CSS, localStorage, sessionStorage, Canvas, Web Audio, IndexedDB, etc.

          If the user's prompt normally needs a framework or library, implement it with vanilla DOM
          manipulation instead: use document.createElement, template literals, event delegation,
          a small render() function, and CSS animations. No shortcuts.

          Return a single index.html. No commentary. No markdown fences. Just the file.

          USER REQUEST:
          """

          FORBIDDEN_PATTERNS = [
              r'<script[^>]+src\s*=\s*["\']https?://',
              r'<link[^>]+href\s*=\s*["\']https?://',
              r'\breact\b', r'\bpreact\b', r'\bvue\b', r'\bsvelte\b', r'\bsolid-js\b',
              r'\balpinejs\b', r'\balpine\.js\b', r'\bhtmx\b', r'\bjquery\b', r'\bzepto\b',
              r'\bbootstrap\b', r'\btailwind\b', r'\bbulma\b', r'\bmaterialize\b',
              r'\bangular\b', r'\bember\b', r'\bbackbone\b', r'\bknockout\b', r'\bmithril\b',
              r'\bstimulus\b', r'\bturbo(?:links)?\b', r'\blit-html\b', r'\bstencil\b',
              r'unpkg\.com', r'cdn\.jsdelivr\.net', r'cdnjs\.cloudflare\.com',
              r'esm\.sh', r'skypack\.dev', r'esm\.run',
              r'\brequire\s*\(\s*["\']',
              r'^\s*import\s+[\w{}\*\s,]+\s+from\s+["\']',
          ]

          def is_vanilla(html_text):
              """Return (True, None) if clean, else (False, offending_regex)."""
              low = html_text.lower()
              for pat in FORBIDDEN_PATTERNS:
                  if re.search(pat, low, flags=re.MULTILINE):
                      return False, pat
              return True, None

          # =========================================================
          # Inputs
          # =========================================================
          PROJECT = os.environ.get('PROJECT', '').strip()
          PROMPT = os.environ.get('PROMPT', '').strip()[:4000]
          IMPROVE = os.environ.get('IMPROVE', 'false') == 'true'
          RETRY_WAIT = int(os.environ.get('RETRY_WAIT', '20'))

          if not os.environ.get('GROQ_API_KEY'):
              fail('The GROQ_API_KEY secret is missing. Add it under Settings -> Secrets and variables -> Actions -> New repository secret.')
          if not PROMPT:
              fail('The prompt is empty.')
          slug = re.sub(r'[^a-z0-9]+', '-', PROJECT.lower()).strip('-')[:40]
          if not slug:
              fail('The project name needs at least one letter or digit.')
          if not Path('backend-src/ai_client.py').exists():
              fail('Could not find backend-src/ai_client.py (grishtesync-backend checkout failed).')

          # =========================================================
          # Next version number
          # =========================================================
          out = Path('projects')
          out.mkdir(exist_ok=True)
          pat = re.compile('^' + re.escape(slug) + r'_v(\d+)\.html$')
          versions = sorted(int(m.group(1)) for m in (pat.match(p.name) for p in out.iterdir()) if m)
          version = (versions[-1] if versions else 0) + 1
          filename = '%s_v%d.html' % (slug, version)

          # =========================================================
          # Build the request (always prefixed with vanilla JS rules)
          # =========================================================
          ask = PROMPT
          repo_code = None
          improved_from = None
          if IMPROVE:
              if not versions:
                  print('No earlier version of "%s" - generating fresh.' % slug)
              else:
                  prev_html = (out / ('%s_v%d.html' % (slug, versions[-1]))).read_text(encoding='utf-8')
                  if len(prev_html) > 30000:
                      print('Previous version is too large to send as context - generating fresh.')
                  else:
                      repo_code = {'index.html': prev_html}
                      improved_from = versions[-1]
                      ask = ('Improve the existing app shown in the current codebase. Keep everything that '
                             'already works and apply this change: ' + PROMPT)

          full_ask = VANILLA_JS_RULES + ask

          # =========================================================
          # Generate with grishtesync-backend
          # =========================================================
          sys.path.insert(0, 'backend-src')
          import ai_client  # reads GROQ_API_KEY at import time

          def call_backend(question):
              last = None
              for attempt in range(1, 4):
                  try:
                      return ai_client.generate_simple(question, 'github_generate', 'github', repo_code=repo_code)
                  except Exception as e:
                      last = e
                      msg = str(e)
                      print('Attempt %d/3 failed: %s' % (attempt, msg[:300]))
                      if attempt < 3:
                          limited = '429' in msg or 'rate' in msg.lower()
                          time.sleep(RETRY_WAIT * attempt if limited else 5)
              raise last

          # --- Pass 1: normal generation ---
          print('Generating %s (v%d)%s ...' % (slug, version, ' - improving v%d' % improved_from if improved_from else ''))
          try:
              files = call_backend(full_ask)
          except Exception as e:
              fail('Code generation failed after 3 attempts: ' + str(e)[:400])

          if not isinstance(files, dict) or not files:
              fail('The model returned no files.')
          texts = {k: v for k, v in files.items() if isinstance(v, str)}
          page = texts.get('index.html') or next((v for k, v in texts.items() if k.lower().endswith('.html')), '')
          css  = texts.get('style.css')  or next((v for k, v in texts.items() if k.lower().endswith('.css')),  '')
          js   = texts.get('script.js')  or next((v for k, v in texts.items() if k.lower().endswith('.js')),   '')
          if '<html' not in page.lower():
              fail('The model did not return a usable index.html.')

          # Merge css/js into the page (unchanged logic)
          if css:
              tag = '<style>\n' + css + '\n</style>'
              page, n = re.subn(r'<link[^>]*href=["\']\.?/?style\.css["\'][^>]*>', lambda m: tag, page, count=1, flags=re.I)
              if n == 0:
                  page = page.replace('</head>', tag + '\n</head>', 1) if '</head>' in page else tag + '\n' + page
          if js:
              tag = '<script>\n' + js.replace('</script>', '<\\/script>') + '\n</script>'
              page, n = re.subn(r'<script[^>]*src=["\']\.?/?script\.js["\'][^>]*>\s*</script>', lambda m: tag, page, count=1, flags=re.I)
              if n == 0:
                  page = page.replace('</body>', tag + '\n</body>', 1) if '</body>' in page else page + '\n' + tag

          # --- Validate: must be vanilla JS ---
          ok, hit = is_vanilla(page)
          if not ok:
              print('Validation failed (matched /%s/). Re-asking with stricter rules...' % hit)
              strict_ask = (
                  'IMPORTANT: The previous attempt violated the vanilla-JS-only rules '
                  '(matched pattern: /%s/). Regenerate the COMPLETE index.html from scratch.\n\n' % hit
              ) + full_ask

              for extra in range(1, 3):  # up to 2 extra attempts
                  try:
                      files2 = call_backend(strict_ask)
                      texts2 = {k: v for k, v in (files2 or {}).items() if isinstance(v, str)}
                      page2 = texts2.get('index.html') or next((v for k, v in texts2.items() if k.lower().endswith('.html')), '')
                      css2  = texts2.get('style.css')  or next((v for k, v in texts2.items() if k.lower().endswith('.css')),  '')
                      js2   = texts2.get('script.js')  or next((v for k, v in texts2.items() if k.lower().endswith('.js')),   '')
                      if '<html' not in page2.lower():
                          print('Extra attempt %d: no index.html, retrying.' % extra)
                          continue
                      if css2:
                          tag = '<style>\n' + css2 + '\n</style>'
                          page2, n = re.subn(r'<link[^>]*href=["\']\.?/?style\.css["\'][^>]*>', lambda m: tag, page2, count=1, flags=re.I)
                          if n == 0:
                              page2 = page2.replace('</head>', tag + '\n</head>', 1) if '</head>' in page2 else tag + '\n' + page2
                      if js2:
                          tag = '<script>\n' + js2.replace('</script>', '<\\/script>') + '\n</script>'
                          page2, n = re.subn(r'<script[^>]*src=["\']\.?/?script\.js["\'][^>]*>\s*</script>', lambda m: tag, page2, count=1, flags=re.I)
                          if n == 0:
                              page2 = page2.replace('</body>', tag + '\n</body>', 1) if '</body>' in page2 else page2 + '\n' + tag
                      ok2, hit2 = is_vanilla(page2)
                      if ok2:
                          print('Extra attempt %d produced clean vanilla JS. Using it.' % extra)
                          page = page2
                          ok, hit = True, None
                          break
                      else:
                          print('Extra attempt %d still matched /%s/.' % (extra, hit2))
                  except Exception as e:
                      print('Extra attempt %d errored: %s' % (extra, str(e)[:200]))

          if not ok:
              fail('Model kept producing non-vanilla output (last match: /%s/). '
                   'Try rephrasing the prompt or rerun.' % hit)

          # =========================================================
          # Write file + manifest + gallery
          # =========================================================
          (out / filename).write_text(page.rstrip() + '\n', encoding='utf-8')
          print('Wrote projects/' + filename + ' (%d bytes)' % len(page))

          mpath = out / 'projects.json'
          try:
              manifest = json.loads(mpath.read_text(encoding='utf-8'))
          except Exception:
              manifest = []
          manifest.append({
              'project': slug, 'version': version, 'file': filename, 'prompt': PROMPT,
              'created': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'improved_from': improved_from,
              'vanilla': True
          })
          mpath.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          GALLERY = '''<!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Ariotica Projects</title>
          <style>
            :root{--bg:#0b1410;--card:#12201a;--line:#1d332a;--fg:#e6f2ea;--muted:#7f9a8b;--accent:#5ab552;--accent2:#7ed17a}
            *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;line-height:1.5}
            header{padding:1.6rem 1rem 1.1rem;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at top,#14261d,#0b1410 70%)}
            header img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(90,181,82,.35))}
            h1{margin:.4rem 0 0;font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase}
            .sub{color:var(--muted);font:.78rem ui-monospace,Menlo,monospace;margin:.5rem 0 0}
            main{max-width:820px;margin:0 auto;padding:1.1rem 1rem 3rem;display:grid;gap:1rem}
            .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem}
            .card h2{margin:0 0 .4rem;font:600 .95rem ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--accent)}
            .prompt{margin:.2rem 0 .8rem;font-size:.9rem;word-break:break-word}
            .vs{display:flex;flex-wrap:wrap;gap:.5rem}
            .v{font:700 .78rem ui-monospace,Menlo,monospace;text-decoration:none;color:var(--accent2);border:1px solid #1f4a2a;background:#17301f;padding:.35rem .7rem;border-radius:999px}
            .v.latest{background:var(--accent);color:#07120b;border-color:var(--accent)}
            .meta{color:var(--muted);font:.7rem ui-monospace,Menlo,monospace;margin:.7rem 0 0}
            .empty{color:var(--muted);text-align:center;font:.85rem ui-monospace,Menlo,monospace}
            .badge{display:inline-block;margin-left:.5rem;font:700 .65rem ui-monospace,Menlo,monospace;letter-spacing:.08em;
                   text-transform:uppercase;color:var(--accent2);border:1px solid #1f4a2a;background:#17301f;padding:.15rem .5rem;border-radius:999px}
          </style></head><body>
          <header><img src="https://raw.githubusercontent.com/suryasticsai/Ariotica/main/Ariotica-logo.png?raw=true" alt="" onerror="this.style.display='none'">
          <h1>Ariotica Projects</h1><p class="sub">Actions &rarr; Generate Project &rarr; Run workflow &middot; vanilla JS only</p></header>
          <main>
          %%CARDS%%
          </main></body></html>
          '''
          groups = {}
          for e in manifest:
              groups.setdefault(e['project'], []).append(e)
          cards = []
          for name, items in sorted(groups.items(), key=lambda kv: max(i['created'] for i in kv[1]), reverse=True):
              items.sort(key=lambda i: i['version'], reverse=True)
              latest = items[0]
              links = []
              for idx, i in enumerate(items):
                  cls = 'v latest' if idx == 0 else 'v'
                  links.append('<a class="%s" href="projects/%s">v%d</a>' % (cls, H.escape(i['file']), i['version']))
              when = latest['created'][:16].replace('T', ' ')
              cards.append(
                  '<article class="card"><h2>%s<span class="badge">vanilla JS</span></h2>'
                  '<p class="prompt">%s</p><div class="vs">%s</div>'
                  '<p class="meta">latest v%d &middot; %s UTC</p></article>'
                  % (H.escape(name), H.escape(latest['prompt'][:240]), ''.join(links), latest['version'], H.escape(when)))
          body = '\n'.join(cards) if cards else '<p class="empty">Nothing yet.</p>'
          Path('index.html').write_text(GALLERY.replace('%%CARDS%%', body), encoding='utf-8')

          # Outputs + summary
          repo = os.environ.get('GITHUB_REPOSITORY', 'suryasticsai/Ariotica')
          owner, name_ = repo.split('/', 1)
          base = 'https://%s.github.io/%s/' % (owner, name_)
          with open(os.environ.get('GITHUB_OUTPUT', os.devnull), 'a') as f:
              f.write('file=projects/%s\n' % filename)
          with open(SUMMARY, 'a', encoding='utf-8') as f:
              f.write('### ✅ Generated `%s`\n\n' % filename)
              f.write('- Project **%s**, version **v%d**%s\n' % (slug, version, (' (improved from v%d)' % improved_from) if improved_from else ''))
              f.write('- Constraint: **pure vanilla JS** (validated)\n')
              f.write('- Open it: %sprojects/%s  (live about a minute after the commit)\n' % (base, filename))
              f.write('- All projects: %s\n' % base)
          PYEOF

      - name: Commit result
        env:
          FILE: ${{ steps.gen.outputs.file }}
        run: |
          git config user.name  "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add projects index.html
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat(projects): ${FILE}"
          git pull --rebase
          git push