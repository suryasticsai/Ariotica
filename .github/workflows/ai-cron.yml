name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name (e.g. kanban)'
        type: string
        required: true
      prompt:
        description: 'What should it build?'
        type: string
        required: true
      improve:
        description: 'Improve the existing file instead of starting fresh'
        type: boolean
        default: false

  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run for issues whose title starts with [BUILD].
    # workflow_dispatch always runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[BUILD]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Octokit
        run: npm install @octokit/rest@20

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_IMPROVE: ${{ inputs.improve }}
          RAGINA_URL: 'https://ragina-crawler-ragina.vercel.app/api/ask'
        run: node generate.js