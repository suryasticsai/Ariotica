name: Ariotica Aigent — Evolve (RAGina)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (for headless RAGina)
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium --with-deps

      - name: Plan and optionally apply with RAGina
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const html = fs.readFileSync('index.html', 'utf8');
          const vMatch = html.match(/<meta\s+name="app-version"\s+content="(\d+)"/);
          const current = vMatch ? parseInt(vMatch[1], 10) : 0;
          const next = current + 1;

          // (… same TASKS, FEATURE_POOL, taskFor, stageOf logic as before …)

          const upgradePrompt = /* build the same prompt string */;

          fs.writeFileSync('plan.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            app: 'Ariotica Aigent',
            currentVersion: current,
            nextVersion: next,
            stage: stageOf(next),
            upgradePrompt
          }, null, 2));

          // Optional auto-apply using RAGina in a headless browser
          if (process.env.AUTO_APPLY === 'true') {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setContent(`<html><body>
              <script src="https://suryasticsai.github.io/RAGina/ragina-t4.js"></script>
            </body></html>`, { waitUntil: 'networkidle' });

            const newHtml = await page.evaluate(async (prompt) => {
              const reply = await RAGina.runAgent(prompt, { maxSteps: 3 });
              return reply;
            }, upgradePrompt);

            await browser.close();

            if (newHtml && newHtml.includes('<html')) {
              fs.writeFileSync('index.html', newHtml);
              console.log('✅ index.html updated by RAGina.');
            }
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name  "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add plan.json index.html
          git diff --staged --quiet || git commit -m "chore(ariotica): evolve via RAGina"
          git push