name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name (e.g. kanban)'
        type: string
        required: true
      prompt:
        description: 'What should it build / change / fix?'
        type: string
        required: true
      mode:
        description: 'Mode'
        type: choice
        options: [create, improve, fix, audit, delete]
        default: create

  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: generate-project
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[BUILD]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Octokit + scanners
        run: npm install @octokit/rest@20 eslint@9 sparrow-sast@1

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: node generate.js