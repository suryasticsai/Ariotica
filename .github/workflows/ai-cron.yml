name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name'
        type: string
        required: true
      prompt:
        description: 'What should it build / change / fix?'
        type: string
        required: true
      mode:
        description: 'Mode'
        type: choice
        options: [create, improve, fix, audit, delete]
        default: create
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[BUILD]')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[BUILD]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROVIDER_ORDER: ${{ vars.PROVIDER_ORDER }}
          RACE_SIZE: ${{ vars.RACE_SIZE }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: node generate.js