name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        type: string
        required: true
      prompt:
        type: string
        required: true
      mode:
        type: choice
        options: [create, improve, fix, audit, delete]
        default: create
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-${{ github.event.issue.number || inputs.project || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       startsWith(github.event.issue.title, '[BUILD]') && 
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && 
       !github.event.issue.pull_request &&
       startsWith(github.event.issue.title, '[BUILD]') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '[improve]') ||
        contains(github.event.comment.body, '[fix]') ||
        contains(github.event.comment.body, '[audit]') ||
        contains(github.event.comment.body, '[delete]') ||
        contains(github.event.comment.body, '[ask]')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate App with AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: node generate.js

      - name: Rebuild Knowledge Index
        run: node build-index.js

      - name: Commit Knowledge Index
        run: |
          git config user.name "ariotica-bot"
          git config user.email "ariotica-bot@users.noreply.github.com"
          git add knowledge/index.json
          git diff --staged --quiet || git commit -m "chore: rebuild knowledge index"
          git push