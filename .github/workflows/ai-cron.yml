name: Generate Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug (folder name under projects/)'
        type: string
        required: true
      prompt:
        description: 'Instructions (optional for revert/delete/leaderboard/ask/skills)'
        type: string
        required: false
        default: ''
      mode:
        description: 'Operation mode'
        type: choice
        options:
          - create
          - improve
          - fix
          - audit
          - delete
          - revert
          - skill
          - skills
          - forge
          - inspire
          - ask
          - leaderboard
        default: create
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: ariotica-${{ github.event.issue.number || inputs.project || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && 
       startsWith(github.event.issue.title, '[BUILD]') && 
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && 
       !github.event.issue.pull_request &&
       startsWith(github.event.issue.title, '[BUILD]') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '[improve]') ||
        contains(github.event.comment.body, '[fix]') ||
        contains(github.event.comment.body, '[audit]') ||
        contains(github.event.comment.body, '[delete]') ||
        contains(github.event.comment.body, '[revert]') ||
        contains(github.event.comment.body, '[ask]') ||
        contains(github.event.comment.body, '[skill]') ||
        contains(github.event.comment.body, '[skills]') ||
        contains(github.event.comment.body, '[forge]') ||
        contains(github.event.comment.body, '[inspire]') ||
        contains(github.event.comment.body, '[leaderboard]')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for the knowledge index rebase

      - name: Parse Request
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DISPATCH_PROJECT: ${{ inputs.project }}
        run: |
          node -e "
            const fs = require('fs');
            const T = require('./lib/text');
            const out = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'valid=' + v + '\n');
            if (process.env.EVENT_NAME === 'workflow_dispatch') { out(true); process.exit(0); }
            if (process.env.EVENT_NAME === 'issues') {
              if (process.env.ISSUE_TITLE.startsWith('[BUILD]')) { out(true); process.exit(0); }
              out(false); process.exit(0);
            }
            if (process.env.EVENT_NAME === 'issue_comment') {
              if (process.env.ISSUE_TITLE.startsWith('[BUILD]') && T.parseComment(process.env.COMMENT_BODY || '')) {
                out(true); process.exit(0);
              }
              out(false); process.exit(0);
            }
            out(false);
          "

      - name: Quick Acknowledge
        id: quick_ack
        if: steps.parse.outputs.valid == 'true' && (github.event_name == 'issue_comment' || github.event_name == 'issues')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            if (issueNumber) {
              if (context.eventName === 'issue_comment') {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'eyes'
                }).catch(() => {});
              }
              
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = `⏳ **Ariotica is spinning up...**\n\nFetching models, warming up the engines, and preparing to work on this. Stand by...\n\n[📊 View Live Logs](${runUrl})`;
              const res = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
              
              core.setOutput('comment_id', res.data.id);
            }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ============================================================
      # PLAYWRIGHT: cache browser + non-interactive apt
      # ============================================================
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          npx playwright install chromium --with-deps

      - name: Validate Agent Code
        run: |
          for f in generate.js lib/*.js; do node --check "$f"; done

      - name: Generate App with AI
        id: run_agent
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEMOTRON_API_KEY: ${{ secrets.NEMOTRON_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          
          # Optional overrides to control the AI model race dynamically
          PROVIDER_ORDER: ${{ vars.PROVIDER_ORDER }}
          RACE_SIZE: ${{ vars.RACE_SIZE }}
          NEMOTRON_MODEL: ${{ vars.NEMOTRON_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_PROMPT: ${{ inputs.prompt }}
          DISPATCH_MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          QUICK_ACK_ID: ${{ steps.quick_ack.outputs.comment_id }}
        run: |
          node generate.js; code=$?
          if [ "$code" -eq 2 ]; then echo "handled=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code

      - name: Rebuild and Commit Knowledge Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git Identity (Fixes the Author Identity Unknown error)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            git fetch -q origin main 
            git reset -q --hard origin/main
            node build-index.js
            git add knowledge/index.json
            git diff --staged --quiet && echo "No index changes to commit." && exit 0
            
            # Commit and push (with rebase fallback just in case)
            git commit -qm "chore: rebuild knowledge index"
            git pull -q --rebase origin main && git push -q && exit 0
            sleep $((i*3))
          done
          echo "Failed to commit knowledge index after 3 retries"
          exit 1

      - name: Upload Generated Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ariotica-build-${{ github.run_id }}
          path: |
            projects/
            receipts/
            drafts/
            analytics/
            knowledge/
          retention-days: 7

      - name: Fatal Error Comment
        if: failure() && steps.run_agent.outcome == 'failure' && steps.quick_ack.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentId = parseInt('${{ steps.quick_ack.outputs.comment_id }}');
            if (commentId) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: `❌ **Fatal System Error**\n\nThe AI agent crashed before it could finish. This is usually caused by an out-of-memory error or a corrupted prompt.\n\n[🔍 Check the logs to debug](${runUrl})`
              }).catch(() => {});
            }

      - name: Generate Job Summary
        if: always()
        env:
          # Fallback to Issue data if inputs.mode is empty (e.g. issue-triggered runs)
          MODE: ${{ inputs.mode || 'issue_command' }}
          PROJECT: ${{ inputs.project || github.event.issue.title }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "## 🤖 Ariotica Build Report" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Project | Mode | Triggered By |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} | \`$PROJECT\` | \`$MODE\` | @$ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          BASE="https://$OWNER.github.io/$REPO/projects/$PROJECT/"
          
          if [ "$MODE" = "ask" ] || [ "$MODE" = "skill" ] || [ "$MODE" = "skills" ] || [ "$MODE" = "forge" ] || [ "$MODE" = "evolve" ] || [ "$MODE" = "leaderboard" ]; then
            echo "🔎 **Mode:** \`$MODE\` — see the issue thread for the result." >> $GITHUB_STEP_SUMMARY
          elif [ "$MODE" = "delete" ]; then
            echo "🗑 **Deleted:** \`$PROJECT\`" >> $GITHUB_STEP_SUMMARY
          elif [ "$MODE" = "revert" ]; then
            echo "↩️ **Reverted:** \`$PROJECT\` — see the issue thread for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[📂 View the Live App]($BASE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "[📂 View the Live App]($BASE)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Run ID: [$RUN_ID](https://github.com/$OWNER/$REPO/actions/runs/$RUN_ID)*" >> $GITHUB_STEP_SUMMARY