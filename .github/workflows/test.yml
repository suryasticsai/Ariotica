name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'generate.js'
      - 'verify-receipt.js'
      - 'package.json'
      - 'libraries_catalog.json'
      - 'trusted_domains.json'
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/**'
      - 'test/**'
      - 'generate.js'
      - 'verify-receipt.js'
      - 'package.json'
      - 'libraries_catalog.json'
      - 'trusted_domains.json'
  workflow_dispatch:   # ← lets you run it manually from the phone

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Unit tests
        run: npm test

      - name: Static tests (diff, report, libraries)
        if: always()
        run: node scripts/test-static.js