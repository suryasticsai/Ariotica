<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="app-version" content="0" />
<title>Ariotica Aigent Console</title>
<style>
  :root {
    --bg:      #0b1410;
    --card:    #12201a;
    --line:    #1d332a;
    --fg:      #e6f2ea;
    --muted:   #7f9a8b;
    --accent:  #5ab552;
    --accent2: #7ed17a;
    --ok:      #9ef0c0;
    --warn:    #ffd479;
    --danger:  #ff7a7a;
    --mono:    ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Georgia", "Times New Roman", serif; line-height: 1.5;
  }

  /* ---------- Header ---------- */
  header {
    padding: 1.6rem 1rem 1.1rem; text-align: center;
    border-bottom: 1px solid var(--line);
    background: radial-gradient(ellipse at top, #14261d 0%, #0b1410 70%);
  }
  .brand { display: inline-flex; align-items: center; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .brand-logo {
    width: 72px; height: 72px; object-fit: contain;
    filter: drop-shadow(0 0 14px rgba(90,181,82,0.35));
  }
  .brand-name {
    font-size: 1.3rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--fg); margin: 0; text-align: left;
  }
  .brand-name .light {
    display: block; font-size: 0.68rem; letter-spacing: 0.3em;
    color: var(--accent); margin-top: 0.2rem; font-family: var(--mono);
  }
  .sub { color: var(--muted); margin: 0.8rem 0 0; font-size: 0.8rem; font-family: var(--mono); }

  main { max-width: 820px; margin: 0 auto; padding: 1.1rem 1rem 3rem; display: grid; gap: 1rem; }

  .card {
    background: var(--card); border-radius: 14px; padding: 1.1rem;
    border: 1px solid var(--line);
  }
  .card h2 {
    margin: 0 0 0.8rem; font-size: 0.95rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
    font-family: var(--mono); font-weight: 600;
  }
  .muted { color: var(--muted); font-size: 0.85rem; font-family: var(--mono); margin: 0.4rem 0; }
  .meta  { color: var(--muted); font-size: 0.72rem; font-family: var(--mono); }
  a { color: var(--accent2); }

  /* ---------- Buttons ---------- */
  .btn {
    padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #07120b; cursor: pointer;
    font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .btn:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost  { background: transparent; color: var(--accent2); }
  .btn.ghost:hover:not(:disabled) { background: #17301f; }
  .btn.danger { background: transparent; color: var(--danger); border-color: #5a2a2a; }
  .btn.danger:hover:not(:disabled) { background: #241414; border-color: var(--danger); }
  .btn.big { width: 100%; padding: 0.95rem 1rem; font-size: 0.88rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
  .row .grow { flex: 1; }

  /* ---------- Connection ---------- */
  input[type=password], input[type=text], textarea {
    width: 100%; padding: 0.65rem 0.75rem; background: #0e1a14; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 0.82rem;
  }
  input[type=password]:focus, input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
  .token-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .token-row input { flex: 1; min-width: 200px; width: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.25rem 0.7rem;
    border-radius: 999px; font-family: var(--mono); font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid #1f4a2a;
    background: #17301f; color: var(--accent);
  }
  .pill.run  { color: var(--warn);   border-color: #5a4a1a; background: #241d0f; }
  .pill.ok   { color: var(--ok);     border-color: #23553a; background: #10261a; }
  .pill.fail { color: var(--danger); border-color: #5a2a2a; background: #241414; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.run .dot { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .statusbar { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.8rem; }

  /* ---------- Thread ---------- */
  .thread { display: grid; gap: 0.6rem; margin-bottom: 0.8rem; }
  .msg {
    padding: 0.6rem 0.8rem; border-radius: 12px; border: 1px solid var(--line);
    background: #0f1c16; font-family: var(--mono); font-size: 0.82rem;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg .who { display: block; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.2rem; }

  /* ---------- Plan ---------- */
  .plan h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
  .plan .rev { font-family: var(--mono); font-size: 0.68rem; color: var(--warn); border: 1px solid #5a4a1a; border-radius: 999px; padding: 0.1rem 0.5rem; margin-left: 0.4rem; vertical-align: middle; }
  .plan p  { margin: 0.3rem 0 0.8rem; font-size: 0.92rem; }
  .plan h4 { margin: 0.9rem 0 0.25rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .plan ol, .plan ul { margin: 0; padding-left: 1.2rem; font-size: 0.9rem; }
  .plan li { margin: 0.25rem 0; }
  .final { margin-top: 1rem; padding-top: 0.9rem; border-top: 1px dashed var(--line); }
  .final .hint { margin: 0.5rem 0 0; }
  .box { padding: 0.65rem 0.8rem; border-radius: 8px; font-family: var(--mono); font-size: 0.78rem; margin-top: 0.8rem; }
  .box.err  { color: var(--danger); background: #1e1010; border: 1px solid #3a1f1f; }
  .box.good { color: var(--ok); background: #10261a; border: 1px solid #23553a; }
  .box.info { color: var(--warn); background: #241d0f; border: 1px solid #5a4a1a; }

  /* ---------- History ---------- */
  ul.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
  ul.hist li { font-family: var(--mono); font-size: 0.76rem; display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  ul.hist .tag { font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); min-width: 3.6rem; }
  ul.hist .tag.error { color: var(--danger); }
  ul.hist .tag.build { color: var(--ok); }
  ul.hist time { color: var(--muted); font-size: 0.68rem; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
    max-width: calc(100% - 2rem); padding: 0.65rem 0.9rem; border-radius: 10px;
    font-family: var(--mono); font-size: 0.78rem; display: none; z-index: 10;
    border: 1px solid var(--line); background: #0e1c14; color: var(--accent2);
  }
  .toast.show { display: block; }
  .toast.ok  { color: var(--ok);     background: #10261a; border-color: #23553a; }
  .toast.err { color: var(--danger); background: #1e1010; border-color: #3a1f1f; }

  /* ---------- App region (the only part the workflow rewrites) ---------- */
  #app-root { display: grid; gap: 0.75rem; }
  #app-root .placeholder {
    color: var(--muted); font-size: 0.9rem; text-align: center;
    padding: 1.75rem 0.5rem; font-family: var(--mono);
    border: 1px dashed var(--line); border-radius: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="brand-logo"
         src="https://raw.githubusercontent.com/suryasticsai/Ariotica/main/Ariotica-logo.png?raw=true"
         alt="Ariotica logo" onerror="this.style.display='none'" />
    <h1 class="brand-name">
      Ariotica
      <span class="light">Aigent Console · <span id="verLabel">v0</span></span>
    </h1>
  </div>
  <p class="sub">You prompt → it plans → you refine → you click Final → it builds once.</p>
</header>

<main>

  <!-- ================= CONNECTION ================= -->
  <section class="card">
    <h2>Connection</h2>
    <div class="statusbar" style="margin-top:0">
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Not linked</span></span>
      <a class="meta" id="runLink" href="#" target="_blank" rel="noopener" style="display:none">view run</a>
      <button class="btn ghost" id="disconnectBtn" type="button" style="display:none;margin-left:auto">Unlink device</button>
    </div>
    <p class="muted" id="linkHelp"></p>
    <details id="manualLink">
      <summary class="muted" style="cursor:pointer">Link manually</summary>
      <div class="token-row" style="margin-top:0.6rem">
        <input type="password" id="keyInput" placeholder="Console key" autocomplete="off" spellcheck="false" />
        <button class="btn" id="linkBtn" type="button">Link</button>
      </div>
      <input type="text" id="relayInput" placeholder="Relay URL (only if not hosted on Vercel)"
             autocomplete="off" spellcheck="false" style="margin-top:0.5rem" />
    </details>
  </section>

  <!-- ================= CONSOLE ================= -->
  <section class="card">
    <h2>Console</h2>
    <div class="thread" id="thread"></div>
    <textarea id="promptInput" maxlength="4000"
      placeholder="Tell Aigent what to build or change… (a follow-up refines the current plan)"></textarea>
    <div class="row">
      <button class="btn grow" id="sendBtn" type="button">Send prompt → plan</button>
      <button class="btn danger" id="discardBtn" type="button">Discard plan</button>
    </div>
    <p class="meta" id="sendHint"></p>
  </section>

  <!-- ================= PLAN ================= -->
  <section class="card">
    <h2>Plan</h2>
    <div class="plan" id="planBody"></div>
    <div class="final">
      <button class="btn big" id="finalBtn" type="button">✔ Final — build this plan</button>
      <p class="muted hint" id="finalHint"></p>
    </div>
  </section>

  <!-- ================= APP ================= -->
  <section class="card">
    <h2>App</h2>
    <div class="box info" id="verBanner" style="display:none;margin:0 0 0.8rem"></div>
    <!-- APP:START -->
    <div id="app-root">
      <div class="placeholder">
        Nothing built yet.<br>
        Describe what you want above, approve a plan, then press <strong>Final</strong>.
      </div>
    </div>
    <!-- APP:END -->
  </section>

  <!-- ================= HISTORY ================= -->
  <section class="card">
    <h2>History</h2>
    <ul class="hist" id="history"></ul>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ---------------- Config ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var myVersion = parseInt((document.querySelector('meta[name="app-version"]') || {}).content || '0', 10) || 0;
  $('verLabel').textContent = 'v' + myVersion;

  /* ---------------- State ---------------- */
  var state = null;          // contents of state.json
  var activeRun = null;      // newest workflow run we know about
  var waitingForRun = false; // dispatched, run not visible yet
  var waitStart = 0;
  var baselineRunId = 0;
  var pollTimer = null;
  var lastSentPrompt = '';

  function emptyState() {
    return { status: 'empty', appVersion: myVersion, prompts: [], plan: null, history: [], lastError: null };
  }

  /* ---------------- Helpers ---------------- */
  // All dynamic text is set via textContent: plan text comes from an AI, never trust it as HTML.
  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'class') n.className = props[k];
      else if (k === 'text') n.textContent = props[k];
      else n.setAttribute(k, props[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null) continue;
      n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    }
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  var toastTimer;
  function toast(msg, kind) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (kind || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 5000);
  }

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }); }
    catch (e) { return ''; }
  }

  /* ---------------- Relay (the GitHub token lives on the server, never here) ---------------- */
  var KEY_NAME = 'ariotica_key', URL_NAME = 'ariotica_relay';
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function getKey() { return load(KEY_NAME); }
  function relayUrl() {
    var u = load(URL_NAME);
    if (u) return u;
    return /\.vercel\.app$/.test(location.hostname) ? location.origin + '/api/console' : '';
  }
  function connected() { return !!(getKey() && relayUrl()); }

  // One-time device link: open  <site>/#key=SECRET  (optionally &relay=https://…/api/console).
  // The fragment never leaves the browser; it is saved and removed from the address bar.
  (function adoptFragment() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    var p = new URLSearchParams(h), k = p.get('key'), r = p.get('relay');
    if (!k && !r) return;
    if (k) store(KEY_NAME, k);
    if (r) store(URL_NAME, r);
    history.replaceState(null, '', location.pathname + location.search);
  })();

  function unlink() {
    store(KEY_NAME, null);
    stopPolling(); activeRun = null; waitingForRun = false;
  }

  function relay(action, payload) {
    return fetch(relayUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-console-key': getKey() },
      body: JSON.stringify(Object.assign({ action: action }, payload || {})),
      cache: 'no-store'
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        return { ok: res.ok, status: res.status, data: data || {} };
      });
    }).catch(function () {
      return { ok: false, status: 0, data: { error: 'Cannot reach the relay.' } };
    }).then(function (r) {
      if (r.status === 401) {
        unlink();
        toast('Key rejected — open your console link again.', 'err');
        render();
      }
      return r;
    });
  }

  /* ---------------- Load state.json ---------------- */
  function loadState() {
    var viaRelay = connected()
      ? relay('state').then(function (r) { return (r.ok && r.data && r.data.state) ? r.data.state : null; })
      : Promise.resolve(null);
    return viaRelay.then(function (st) {
      if (st) return st;
      // Fallback: the deployed copy (can lag a minute behind a fresh commit).
      return fetch('state.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : emptyState(); })
        .catch(function () { return emptyState(); });
    }).then(function (st) { state = st; render(); });
  }

  /* ---------------- Workflow runs ---------------- */
  function latestRun() {
    return relay('runs').then(function (r) { return (r.ok && r.data && r.data.run) || null; });
  }

  function busy() {
    return waitingForRun || (!!activeRun && activeRun.status !== 'completed');
  }

  function stopPolling() { clearInterval(pollTimer); pollTimer = null; }
  function startPolling() { stopPolling(); pollTimer = setInterval(pollRun, 4000); pollRun(); }

  function pollRun() {
    latestRun().then(function (run) {
      if (waitingForRun) {
        if (!run || run.id <= baselineRunId) {
          if (Date.now() - waitStart > 60000) {
            waitingForRun = false; stopPolling();
            toast('The run never appeared. Check the Actions tab.', 'err');
            render();
          }
          return;
        }
        waitingForRun = false;
      }
      if (!run) return;
      activeRun = run;
      if (run.status === 'completed') {
        stopPolling();
        var good = run.conclusion === 'success';
        toast(good ? 'Done.' : 'The run failed — see the plan card for details.', good ? 'ok' : 'err');
        loadState().then(function () {
          // Give the prompt back if it was rejected, so nothing typed is lost.
          if (!good && lastSentPrompt && !$('promptInput').value) $('promptInput').value = lastSentPrompt;
          lastSentPrompt = '';
        });
      } else {
        render();
      }
    });
  }

  function dispatch(mode, extra) {
    if (busy()) return Promise.resolve(false);
    return latestRun().then(function (base) {
      baselineRunId = base ? base.id : 0;
      var payload = Object.assign({ mode: mode, prompt: '', plan_rev: '' }, extra || {});
      return relay('dispatch', payload);
    }).then(function (r) {
      if (r.ok) {
        waitingForRun = true; waitStart = Date.now(); activeRun = null;
        render(); startPolling();
        return true;
      }
      if (r.status !== 401) toast((r.data && r.data.error) || ('Dispatch failed (' + r.status + ')'), 'err');
      return false;
    });
  }

  /* ---------------- Rendering ---------------- */
  function renderStatus() {
    var pill = $('statusPill'), text = $('statusText'), link = $('runLink');
    var cls = 'pill', label;
    if (!connected()) { label = 'Not linked'; }
    else if (busy()) { cls += ' run'; label = (activeRun && activeRun.status === 'in_progress') ? 'Working…' : 'Starting…'; }
    else if (activeRun && activeRun.conclusion === 'failure') { cls += ' fail'; label = 'Last run failed'; }
    else if (activeRun && activeRun.conclusion === 'success') { cls += ' ok'; label = 'Idle — last run ok'; }
    else { label = 'Idle'; }
    pill.className = cls; text.textContent = label;
    if (activeRun && activeRun.html_url) { link.href = activeRun.html_url; link.style.display = ''; }
    else link.style.display = 'none';

    $('disconnectBtn').style.display = connected() ? '' : 'none';
    $('manualLink').style.display = connected() ? 'none' : '';
    $('linkHelp').textContent = connected() ? '' :
      'This device is not linked yet. Open your private console link once (' + location.origin + location.pathname + '#key=YOUR_KEY) and it stays linked.';
  }

  function renderThread() {
    var box = $('thread'); clear(box);
    var prompts = (state && state.prompts) || [];
    prompts.forEach(function (p) {
      box.appendChild(el('div', { class: 'msg' }, el('span', { class: 'who', text: 'You · #' + p.n }), p.text));
    });
    if (prompts.length && state.plan && state.status === 'planned') {
      box.appendChild(el('div', { class: 'msg' },
        el('span', { class: 'who', text: 'Aigent' }),
        'Drafted plan rev ' + state.plan.rev + '. Send another prompt to refine it, or press Final.'));
    }
    box.style.display = box.childNodes.length ? '' : 'none';
  }

  function block(title, items, listTag) {
    if (!items || !items.length) return null;
    var list = el(listTag);
    items.forEach(function (t) { list.appendChild(el('li', { text: t })); });
    return el('div', null, el('h4', { text: title }), list);
  }

  function renderPlan() {
    var body = $('planBody'); clear(body);
    var p = state && state.plan;
    if (!p) {
      body.appendChild(el('p', { class: 'muted', text: 'No plan yet. Send a prompt and Aigent will draft one for you to review.' }));
    } else {
      body.appendChild(el('h3', null, p.title || 'Untitled plan', el('span', { class: 'rev', text: 'rev ' + p.rev })));
      if (p.summary) body.appendChild(el('p', { text: p.summary }));
      [block('Steps', p.steps, 'ol'), block('Acceptance checks', p.acceptance, 'ul'), block('Risks', p.risks, 'ul')]
        .forEach(function (b) { if (b) body.appendChild(b); });
      if (p.generatedAt) body.appendChild(el('p', { class: 'meta', text: 'Drafted ' + fmtTime(p.generatedAt) }));
    }
    if (state && state.status === 'built' && p && p.builtVersion) {
      body.appendChild(el('div', { class: 'box good', text: '✔ Built v' + p.builtVersion + ' from this plan. Send a new prompt to plan the next change.' }));
    }
    if (state && state.lastError) {
      body.appendChild(el('div', { class: 'box err', text: 'Last error (' + state.lastError.mode + '): ' + state.lastError.message }));
    }
  }

  function renderHistory() {
    var ul = $('history'); clear(ul);
    var items = ((state && state.history) || []).slice(-15).reverse();
    if (!items.length) { ul.appendChild(el('li', { class: 'muted', text: 'Nothing yet.' })); return; }
    items.forEach(function (h) {
      ul.appendChild(el('li', null,
        el('span', { class: 'tag ' + h.type, text: h.type }),
        el('span', { text: h.text }),
        el('time', { text: fmtTime(h.at) })));
    });
  }

  function renderBanner() {
    var b = $('verBanner');
    if (state && state.appVersion > myVersion) {
      clear(b);
      b.appendChild(document.createTextNode('v' + state.appVersion + ' is built (you are viewing v' + myVersion + '). It can take ~1 minute to deploy. '));
      var a = el('a', { href: '#', text: 'Reload' });
      a.addEventListener('click', function (e) {
        e.preventDefault();
        location.href = location.pathname + '?v=' + Date.now();
      });
      b.appendChild(a);
      b.style.display = '';
    } else b.style.display = 'none';
  }

  function renderButtons() {
    var has = connected(), isBusy = busy();
    var status = state ? state.status : 'empty';
    var canFinal = has && !isBusy && status === 'planned' && state.plan;

    $('sendBtn').disabled = !has || isBusy;
    $('discardBtn').disabled = !has || isBusy || !(state && state.plan);
    $('promptInput').disabled = !has;
    $('finalBtn').disabled = !canFinal;

    var hint = $('finalHint'), sendHint = $('sendHint');
    if (!has) { hint.textContent = 'Link this device first.'; sendHint.textContent = ''; }
    else if (isBusy) { hint.textContent = 'Working — buttons unlock when the run finishes.'; sendHint.textContent = ''; }
    else if (status === 'planned') {
      hint.textContent = 'Final builds this exact plan once, then stops.';
      sendHint.textContent = 'A new prompt revises the plan above.';
    } else if (status === 'built') {
      hint.textContent = 'Already built. Send a new prompt to start the next change.';
      sendHint.textContent = 'A new prompt starts a fresh plan on top of the current app.';
    } else {
      hint.textContent = 'Final unlocks once there is a plan.';
      sendHint.textContent = '';
    }
    $('finalBtn').textContent = status === 'built' ? '✔ Built' : '✔ Final — build this plan';
  }

  function render() {
    renderStatus(); renderThread(); renderPlan(); renderHistory(); renderBanner(); renderButtons();
  }

  /* ---------------- Events ---------------- */
  $('linkBtn').addEventListener('click', function () {
    var k = $('keyInput').value.trim(), u = $('relayInput').value.trim();
    if (!k) { toast('Enter the console key first.', 'err'); return; }
    store(KEY_NAME, k);
    if (u) store(URL_NAME, u);
    $('keyInput').value = '';
    if (!relayUrl()) { toast('Also enter the relay URL.', 'err'); return; }
    toast('Device linked.', 'ok');
    boot();
  });

  $('disconnectBtn').addEventListener('click', function () {
    unlink(); toast('Device unlinked.'); render();
  });

  $('sendBtn').addEventListener('click', function () {
    var text = $('promptInput').value.trim();
    if (!text) { toast('Write a prompt first.', 'err'); return; }
    lastSentPrompt = text;
    dispatch('plan', { prompt: text }).then(function (ok) {
      if (ok) $('promptInput').value = '';
      else lastSentPrompt = '';
    });
  });

  $('finalBtn').addEventListener('click', function () {
    if (!state || !state.plan || state.status !== 'planned') return;
    var p = state.plan;
    if (!confirm('Build plan rev ' + p.rev + ' — "' + p.title + '"?\n\nThis runs once and updates the app.')) return;
    dispatch('apply', { plan_rev: String(p.rev) });
  });

  $('discardBtn').addEventListener('click', function () {
    if (!confirm('Discard the current plan and conversation?')) return;
    dispatch('reset');
  });

  /* ---------------- Boot ---------------- */
  function boot() {
    render();
    loadState();
    if (!connected()) return;
    latestRun().then(function (run) {
      activeRun = run;
      render();
      if (run && run.status !== 'completed') startPolling(); // resume after a page reload
    });
  }

  boot();
})();
</script>
</body>
</html>
