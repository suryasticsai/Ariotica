<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ariotica — AI App Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root {
      --bg: #0b1410;
      --card: #131e19;
      --fg: #e8ecf5;
      --accent: #5ab552;
      --muted: #8b93a8;
    }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
    .navbar { background: rgba(11, 20, 16, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2e26; }
    .navbar-brand { font-weight: 800; color: var(--accent) !important; letter-spacing: -0.5px; }
    .card-custom { background: var(--card); border: 1px solid #1f2e26; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
    .card-custom:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: var(--accent); }
    .app-icon { width: 48px; height: 48px; border-radius: 10px; background: #1f2e26; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .badge-grade { background: #2c3e35; color: #9ef0c0; font-weight: 600; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #7fe375; }
    .table { color: var(--fg); border-color: #1f2e26; }
    .table-hover tbody tr:hover { color: var(--fg); background-color: #1f2e26; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">⚡ Ariotica</a>
      <div class="ms-auto">
        <a href="https://github.com/suryasticsai/Ariotica/issues/new" target="_blank" class="btn btn-outline-success btn-sm">+ New Build</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <!-- Stats Row -->
    <div class="row mb-4" id="statsRow">
      <div class="col-md-4 mb-3">
        <div class="card-custom p-4 text-center">
          <div class="stat-value" id="totalApps">-</div>
          <div class="stat-label">Apps Built</div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card-custom p-4 text-center">
          <div class="stat-value" id="totalCost">-</div>
          <div class="stat-label">Total API Cost</div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card-custom p-4 text-center">
          <div class="stat-value" id="totalTokens">-</div>
          <div class="stat-label">Tokens Used</div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- App Gallery -->
      <div class="col-lg-8">
        <h4 class="mb-3 text-light">Deployed Apps</h4>
        <div class="row" id="appGrid">
          <div class="col-12 text-center py-5 text-muted">Loading apps...</div>
        </div>
      </div>

      <!-- Leaderboard -->
      <div class="col-lg-4 mt-4 mt-lg-0">
        <h4 class="mb-3 text-light">🏆 Model Leaderboard</h4>
        <div class="card-custom p-3">
          <table class="table table-sm table-borderless table-hover mb-0">
            <thead>
              <tr>
                <th>Model</th>
                <th class="text-end">Win Rate</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="2" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Fetch and render the dashboard
    async function loadDashboard() {
      try {
        // 1. Load Projects
        const projRes = await fetch('projects.json?t=' + Date.now());
        const projects = await projRes.json();
        
        const grid = document.getElementById('appGrid');
        grid.innerHTML = '';
        document.getElementById('totalApps').textContent = projects.length;

        projects.sort((a, b) => new Date(b.created) - new Date(a.created));

        projects.forEach(p => {
          const url = `projects/${p.project}/`;
          const icon = p.project.charAt(0).toUpperCase();
          
          grid.innerHTML += `
            <div class="col-md-6 mb-3">
              <a href="${url}" class="text-decoration-none">
                <div class="card-custom p-3 d-flex flex-row align-items-center h-100">
                  <div class="app-icon me-3">${icon}</div>
                  <div>
                    <h6 class="mb-1 text-light">${p.project}</h6>
                    <div class="small text-muted mb-1">v${p.version} • ${p.mode}</div>
                    <span class="badge badge-grade">${p.grade}</span>
                  </div>
                </div>
              </a>
            </div>
          `;
        });

        // 2. Load Costs
        try {
          const costRes = await fetch('analytics/costs.json?t=' + Date.now());
          const costs = await costRes.json();
          const totalCost = costs.reduce((s, c) => s + (c.cost || 0), 0);
          const totalTokens = costs.reduce((s, c) => s + (c.tokensIn || 0) + (c.tokensOut || 0), 0);
          
          document.getElementById('totalCost').textContent = '$' + totalCost.toFixed(4);
          document.getElementById('totalTokens').textContent = (totalTokens / 1000).toFixed(1) + 'k';
        } catch (e) { console.warn('No cost data yet'); }

        // 3. Load Leaderboard
        try {
          const lbRes = await fetch('analytics/leaderboard.json?t=' + Date.now());
          const lb = await lbRes.json();
          const models = Object.values(lb.models || {})
            .filter(m => m.wins + m.losses > 0)
            .sort((a, b) => b.winRate - a.winRate)
            .slice(0, 5);
            
          const tbody = document.getElementById('leaderboardBody');
          if (models.length === 0) throw new Error('No races yet');
          
          tbody.innerHTML = models.map(m => `
            <tr>
              <td class="small text-truncate" style="max-width: 150px;">${m.model}</td>
              <td class="text-end fw-bold text-success">${(m.winRate * 100).toFixed(0)}%</td>
            </tr>
          `).join('');
        } catch (e) { 
          document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="2" class="text-center text-muted">No races yet</td></tr>';
        }

      } catch (e) {
        document.getElementById('appGrid').innerHTML = '<div class="col-12 text-danger">Failed to load projects.json</div>';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
