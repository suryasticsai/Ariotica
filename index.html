<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="app-version" content="0" />
<title>Ariotica Aigent</title>
<style>
  /* … same styles as before, plus a small button row … */
  .raginaBar { display: flex; gap: 0.5rem; margin-top: 0.5rem; justify-content: flex-end; }
  .raginaBar button {
    padding: 0.5rem 1rem;
    border: 0;
    border-radius: 8px;
    background: var(--accent2, #7ed17a);
    color: #07120b;
    font-weight: 700;
    cursor: pointer;
    font-family: ui-monospace, Menlo, monospace;
    text-transform: uppercase;
    font-size: 0.78rem;
  }
  .raginaBar button:disabled { opacity: 0.5; cursor: not-allowed; }
  #generatedCode {
    width: 100%;
    min-height: 260px;
    background: #0e1a14;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.85rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem;
    resize: vertical;
    margin-top: 0.75rem;
  }
</style>
</head>
<body>
<!-- … same header … -->

<main>
  <!-- APP region (unchanged) -->
  <section class="card">
    <h2>App <span class="stage" id="stageBadge">prototype</span></h2>
    <!-- APP:START -->
    <div id="app-root">
      <div class="placeholder">Waiting for the first prototype…</div>
    </div>
    <!-- APP:END -->
  </section>

  <section class="card">
    <h2>Roadmap</h2>
    <p class="meta" id="planMeta">Loading plan.json…</p>
    <ol class="roadmap" id="roadmap"></ol>
  </section>

  <section class="card">
    <h2>Next Evolution Prompt</h2>
    <p class="meta">Paste this into any AI, or click <strong>Generate with RAGina</strong> below.</p>
    <textarea id="prompt" readonly></textarea>
    <div class="raginaBar">
      <button id="copyBtn" type="button">Copy prompt</button>
      <button id="raginaBtn" type="button">Generate with RAGina</button>
    </div>
    <textarea id="generatedCode" placeholder="RAGina output will appear here…" readonly style="display:none;"></textarea>
  </section>
</main>

<!-- 1. Load RAGina from its GitHub Pages CDN -->
<script src="https://suryasticsai.github.io/RAGina/ragina-t4.js"></script>

<script>
(function () {
  // … existing plan-loading logic …

  const raginaBtn = document.getElementById('raginaBtn');
  const generatedCode = document.getElementById('generatedCode');

  raginaBtn.addEventListener('click', async () => {
    const prompt = document.getElementById('prompt').value;
    if (!prompt) return;

    raginaBtn.disabled = true;
    raginaBtn.textContent = 'RAGina is thinking…';

    try {
      // 2. Call RAGina's agent
      // The library exposes a runAgent function; we pass the prompt and ask for the full HTML.
      const reply = await RAGina.runAgent(prompt, {
        maxSteps: 3,          // keep it focused
        persona: 'You are a precise code generator. Output only the raw index.html file.'
      });

      // 3. Display the result
      generatedCode.value = reply;
      generatedCode.style.display = 'block';

      // Optional: auto-copy to clipboard
      await navigator.clipboard.writeText(reply);

      raginaBtn.textContent = 'Copied to clipboard ✓';
      setTimeout(() => {
        raginaBtn.textContent = 'Generate with RAGina';
        raginaBtn.disabled = false;
      }, 1800);
    } catch (err) {
      alert('RAGina error: ' + err.message);
      raginaBtn.textContent = 'Generate with RAGina';
      raginaBtn.disabled = false;
    }
  });

  // … rest of the script (loadPlan, etc.) …
})();
</script>
</body>
</html>
