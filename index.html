<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ariotica Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --bg:#0b1410; --card:#12201a; --line:#1d332a; --fg:#e6f2ea; --accent:#5ab552; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .btn-ai { background:var(--accent); color:#000; font-weight:bold; }
  .btn-ai:hover { background:#7ed17a; color:#000; }
  .mode-badge { cursor:pointer; border:1px solid var(--line); padding:0.5rem 1rem; border-radius:8px; }
  .mode-badge.active { background:var(--accent); color:#000; border-color:var(--accent); }
</style>
</head>
<body class="p-3">

<div class="container" style="max-width:800px;">
  <h1 class="text-center mt-3 mb-4">⚡ Ariotica</h1>

  <!-- Mode Switcher -->
  <div class="d-flex justify-content-center gap-3 mb-4">
    <div id="btnModeIssue" class="mode-badge active" onclick="setMode('issue')">📋 Issue Mode (No Token)</div>
    <div id="btnModeDirect" class="mode-badge" onclick="setMode('direct')">⚡ Direct Mode (Fast)</div>
  </div>

  <!-- Token Input (Only for Direct Mode) -->
  <div class="card p-3 mb-4" id="tokenSection" style="display:none;">
    <label class="form-label text-muted">GitHub Personal Access Token (Session Only)</label>
    <div class="d-flex gap-2">
      <input type="password" id="tokenInput" class="form-control bg-dark text-white border-secondary" placeholder="github_pat_...">
      <button class="btn btn-ai" onclick="saveToken()">Save</button>
    </div>
    <small class="text-muted mt-2 d-block">Token is destroyed when you close this tab.</small>
  </div>

  <!-- Main Form -->
  <div class="card p-4">
    <div class="mb-3">
      <label class="form-label text-muted">What do you want to do?</label>
      <select id="actionSelect" class="form-select bg-dark text-white border-secondary" onchange="updateUI()">
        <option value="create">✨ Create a new app</option>
        <option value="improve">🔄 Improve an app</option>
        <option value="fix">🔧 Fix a bug</option>
      </select>
    </div>

    <div class="mb-3" id="nameRow">
      <label class="form-label text-muted">Project Name</label>
      <input type="text" id="projectName" class="form-control bg-dark text-white border-secondary" placeholder="e.g. kanban">
    </div>

    <div class="mb-3">
      <label class="form-label text-muted">Description / Instructions</label>
      <textarea id="promptText" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Describe the app..."></textarea>
    </div>

    <button class="btn btn-ai w-100 py-3" onclick="triggerBuild()">🚀 Trigger Agent</button>
  </div>
</div>

<script>
  let currentMode = 'issue';

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnModeIssue').classList.toggle('active', mode === 'issue');
    document.getElementById('btnModeDirect').classList.toggle('active', mode === 'direct');
    document.getElementById('tokenSection').style.display = mode === 'direct' ? 'block' : 'none';
  }

  // SECURITY FIX: sessionStorage clears when the tab closes
  function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) return alert('Paste a token first');
    sessionStorage.setItem('gh_pat', t);
    alert('Token saved to this session only.');
  }

  function updateUI() {
    const act = document.getElementById('actionSelect').value;
    document.getElementById('nameRow').style.display = act === 'create' ? 'block' : 'none';
  }

  async function triggerBuild() {
    const action = document.getElementById('actionSelect').value;
    const project = document.getElementById('projectName').value.trim();
    const prompt = document.getElementById('promptText').value.trim();
    
    if (!project || !prompt) return alert('Please fill in all fields.');

    if (currentMode === 'issue') {
      // ISSUE MODE: Open a new GitHub issue tab
      const suffix = action !== 'create' ? ` [${action}]` : '';
      const title = `[BUILD] ${project}${suffix}`;
      const url = `https://github.com/suryasticsai/Ariotica/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(prompt)}`;
      window.open(url, '_blank');
    } else {
      // DIRECT MODE: Use session token to hit the API
      const token = sessionStorage.getItem('gh_pat');
      if (!token) return alert('Please save a token for Direct Mode.');

      try {
        const res = await fetch('https://api.github.com/repos/suryasticsai/Ariotica/actions/workflows/ai-cron.yml/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: { project: project, prompt: prompt, mode: action }
          })
        });

        if (res.status === 204) alert('✅ Workflow triggered successfully! Check the Actions tab.');
        else alert('❌ Failed to trigger: ' + res.status);
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }
  }
</script>
</body>
</html>
