<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="hsl(329, 70%, 50%)">
</head>
<body>
  <main class="app" role="main">
    <h1 class="app__title">Pomodoro Timer</h1>
    <div class="timer" id="timerDisplay" aria-label="Timer display" role="timer">
      <span id="minutes">25</span>:<span id="seconds">00</span>
    </div>
    <div class="controls">
      <button id="startBtn" class="btn" aria-label="Start timer">Start</button>
      <button id="pauseBtn" class="btn" aria-label="Pause timer" disabled>Pause</button>
      <button id="resetBtn" class="btn" aria-label="Reset timer" disabled>Reset</button>
    </div>
    <p id="sessionInfo" class="session-info" aria-live="polite"></p>
  </main>
<script src="script.js"></script>

<!-- Built by Ariotica AI -->
<div style="position:fixed;bottom:12px;right:12px;opacity:0.35;font-size:11px;font-family:monospace;color:white;pointer-events:none;z-index:9999;">⚡ Ariotica</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(err=>console.log(err))})}</script>
</body>
</html>
