<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanban Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Kanban Board</h1>
<button id="themeToggle" aria-label="Toggle dark mode">🌙</button>
<div id="board" class="board">
  <div class="column" data-id="todo">
    <h2>To Do</h2>
    <button class="addBtn" aria-label="Add card to To Do">Add Card</button>
    <div class="card-list" data-id="todo"></div>
  </div>
  <div class="column" data-id="inprogress">
    <h2>In Progress</h2>
    <button class="addBtn" aria-label="Add card to In Progress">Add Card</button>
    <div class="card-list" data-id="inprogress"></div>
  </div>
  <div class="column" data-id="done">
    <h2>Done</h2>
    <button class="addBtn" aria-label="Add card to Done">Add Card</button>
    <div class="card-list" data-id="done"></div>
  </div>
</div>
<script src="script.js"></script>

<!-- Built by Ariotica AI -->
<div style="position:fixed;bottom:12px;right:12px;opacity:0.35;font-size:11px;font-family:monospace;color:white;pointer-events:none;z-index:9999;">⚡ Ariotica</div>
</body>
</html>
