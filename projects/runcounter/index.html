<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' ; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self';">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla Counter App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="hsl(295, 70%, 50%)">
</head>
<body>
  <main class="container" aria-label="Counter Application">
    <h1>Simple Counter</h1>
    <div class="counter" id="count" aria-live="polite" aria-atomic="true">0</div>
    <div class="controls">
      <button id="incBtn" aria-label="Increase count">Increase</button>
      <button id="resetBtn" aria-label="Reset count to zero">Reset</button>
    </div>
  </main>
  <script src="script.js"></script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
