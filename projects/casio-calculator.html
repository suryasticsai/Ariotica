<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casio Calculator</title>
<style>
body{font-family:system-ui,Georgia,ui-monospace,Menlo;background:#222;color:#eee;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.calculator{background:#111;border-radius:10px;padding:20px;box-shadow:0 0 20px rgba(0,0,0,.5);width:260px;}
.display{background:#000;color:#0f0;font-size:2rem;text-align:right;padding:10px;border-radius:5px;overflow:hidden;white-space:nowrap;}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
button{font-size:1.2rem;padding:15px;border:none;border-radius:5px;background:#333;color:#fff;cursor:pointer;}
button:active{background:#555;}
button.operator{background:#ff9500;color:#fff;}
button.clear{background:#ff3b30;}
</style>
</head>
<body>
<div class="calculator">
<div class="display" id="display">0</div>
<div class="buttons">
<button class="clear">C</button>
<button class="operator">±</button>
<button class="operator">%</button>
<button class="operator">÷</button>
<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">×</button>
<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">−</button>
<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>
<button>0</button>
<button>.</button>
<button>=</button>
</div>
</div>
<script>
(function(){
const display=document.getElementById('display');
let current='0',prev=null,op=null,reset=false;
function update(){display.textContent=current;}
function inputDigit(d){if(reset||current==='0'){current=d;reset=false;}else{current+=d;}}
function inputDot(){if(reset){current='0.';reset=false;return;}if(!current.includes('.'))current+='.';}
function clearAll(){current='0';prev=null;op=null;reset=false;}
function toggleSign(){if(current.charAt(0)==='-')current=current.slice(1);else if(current!=='0')current='-'+current;}
function percent(){current=(parseFloat(current)/100).toString();}
function setOperator(o){if(prev!==null&&op){compute();}else{prev=parseFloat(current);}op=o;reset=true;}
function compute(){if(op===null||prev===null)return;const a=prev;const b=parseFloat(current);let res;if(op==='÷')res=a/b;else if(op==='×')res=a*b;else if(op==='−')res=a-b;else if(op==='+')res=a+b;else return;current=res.toString();prev=null;op=null;}
document.querySelectorAll('.buttons button').forEach(b=>{b.addEventListener('click',()=>{const txt=b.textContent;if(txt>='0'&&txt<='9'){inputDigit(txt);}else if(txt==='.'){inputDot();}else if(txt==='C'){clearAll();}else if(txt==='±'){toggleSign();}else if(txt==='%'){percent();}else if(txt==='='){compute();reset=true;}else{setOperator(txt);}update();});});
update();
})();
</script>
</body>
</html>
