<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casio Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,Georgia,ui-monospace,Menlo;background:#222;color:#eee;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
.calculator{background:#111;border-radius:10px;padding:1rem;box-shadow:0 0 20px rgba(0,0,0,.5);width:100%;max-width:320px;}
.brand{font-size:1.5rem;text-align:center;margin-bottom:0.5rem;color:#ff9500;}
.display{background:#000;color:#0f0;font-size:2.5rem;text-align:right;padding:0.5rem;border-radius:5px;overflow:hidden;white-space:nowrap;}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-top:0.5rem;}
button{font-size:1.5rem;padding:0.8rem;border:none;border-radius:5px;background:#333;color:#fff;cursor:pointer;}
button:active{background:#555;}
button.operator{background:#ff9500;color:#fff;}
button.clear{background:#ff3b30;}
@media (max-width:400px){
button{font-size:1.2rem;padding:0.6rem;}
.display{font-size:2rem;}
}
</style>
</head>
<body>
<div class="calculator">
<div class="brand">Casio</div>
<div class="display" id="display">0</div>
<div class="buttons">
<button class="clear">C</button>
<button class="operator">±</button>
<button class="operator">%</button>
<button class="operator">÷</button>
<button>7</button>
<button>8</button>
<button>9</button>
<button class="operator">×</button>
<button>4</button>
<button>5</button>
<button>6</button>
<button class="operator">−</button>
<button>1</button>
<button>2</button>
<button>3</button>
<button class="operator">+</button>
<button>0</button>
<button>.</button>
<button class="operator">=</button>
<button class="operator">√</button>
<button class="operator">1/x</button>
</div>
</div>
<script>
(function(){
const d=document.getElementById('display');
let cur='0',prev=null,op=null,reset=false,expr='';
function upd(){d.textContent=expr||cur;}
function digit(x){
if(reset){cur=x;reset=false;expr='';}
else if(cur==='0'){cur=x;}else{cur+=x;}
}
function dot(){
if(reset){cur='0.';reset=false;expr='';return;}
if(!cur.includes('.'))cur+='.';
}
function clr(){cur='0';prev=null;op=null;reset=false;expr='';}
function sign(){if(cur.charAt(0)==='-')cur=cur.slice(1);else if(cur!=='0')cur='-'+cur;}
function pct(){cur=(parseFloat(cur)/100).toString();}
function sqrt(){cur=Math.sqrt(parseFloat(cur)).toString();}
function recip(){cur=(1/parseFloat(cur)).toString();}
function setOp(o){
if(prev!==null&&op){calc();}
else{prev=parseFloat(cur);}
if(expr===''){expr=cur+o;}else{expr+=cur+o;}
op=o;reset=true;
}
function calc(){
if(op===null||prev===null)return;
const a=prev;
const bStr=cur;
const b=parseFloat(cur);
let r;
if(op==='÷')r=a/b;
else if(op==='×')r=a*b;
else if(op==='−')r=a-b;
else if(op==='+')r=a+b;
else return;
expr+=bStr+'='+r;
cur=r.toString();
prev=null;op=null;reset=true;
}
document.querySelectorAll('.buttons button').forEach(b=>{
 b.addEventListener('click',()=>{
 const t=b.textContent;
 if(t>='0'&&t<='9'){digit(t);} 
 else if(t==='.'){dot();}
 else if(t==='C'){clr();}
 else if(t==='±'){sign();}
 else if(t==='%'){pct();}
 else if(t==='√'){sqrt();}
 else if(t==='1/x'){recip();}
 else if(t==='='){calc();}
 else{setOp(t);}
 upd();
 });
});
upd();
})();
</script>
</body>
</html>
