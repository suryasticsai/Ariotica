<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Kanban Board</title>\n<link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n<header>\n<h1>Kanban Board</h1>\n<button id=\"theme-toggle\">🌙</button>\n</header>\n<main>\n<form id=\"add-form\">\n<input type=\"text\" id=\"title-input\" placeholder=\"Title\" required>\n<input type=\"text\" id=\"desc-input\" placeholder=\"Description\" required>\n<select id=\"status-select\">\n<option value=\"todo\">To Do</option>\n<option value=\"inprogress\">In Progress</option>\n<option value=\"done\">Done</option>\n</select>\n<button type=\"submit\">Add Card</button>\n</form>\n<div class=\"board\">\n<div class=\"column\" data-status=\"todo\">\n<h2>🗒 To Do <button class=\"rename-col\" data-status=\"todo\">✏️</button></h2>\n<ul class=\"card-list\" data-status=\"todo\"></ul>\n</div>\n<div class=\"column\" data-status=\"inprogress\">\n<h2>🚧 In Progress <button class=\"rename-col\" data-status=\"inprogress\">✏️</button></h2>\n<ul class=\"card-list\" data-status=\"inprogress\"></ul>\n</div>\n<div class=\"column\" data-status=\"done\">\n<h2>✅ Done <button class=\"rename-col\" data-status=\"done\">✏️</button></h2>\n<ul class=\"card-list\" data-status=\"done\"></ul>\n</div>\n</div>\n</main>\n<script src=\"script.js\"></script>\n<div style=\"position:fixed;bottom:12px;right:12px;opacity:0.35;font-size:11px;font-family:monospace;color:white;pointer-events:none;z-index:9999;\">⚡ Ariotica</div>\n
