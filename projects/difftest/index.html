<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' ; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self';">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="hsl(121, 70%, 50%)">
</head>
<body>
  <main id="app" class="container" aria-label="Counter application">
    <h1 class="title">Simple Counter</h1>
    <p id="message" class="message" aria-live="polite">No clicks yet, start counting!</p>
    <div class="counter-display" aria-label="Current count" role="status">0</div>
    <button id="incrementBtn" class="btn" type="button" aria-label="Increment counter">Add +1</button>
    <button id="resetBtn" class="btn" type="button" aria-label="Reset counter">Reset</button>
  </main>
  <script src="script.js"></script>

<!-- Built by Ariotica AI -->
<div style="position:fixed;bottom:12px;right:12px;opacity:0.35;font-size:11px;font-family:monospace;color:white;pointer-events:none;z-index:9999;">⚡ Ariotica</div>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
