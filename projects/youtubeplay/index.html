<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Player with Transcript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>YouTube Player</h1>
  </header>
  <main class="main">
    <section class="controls" aria-label="Video controls">
      <input type="text" id="video-id" placeholder="Enter YouTube URL or ID" aria-label="YouTube video URL or ID">
      <button id="load-btn" aria-label="Load video">Load Video</button>
    </section>
    <section id="player-container" class="player-container" aria-live="polite">
      <p class="empty-state">No video loaded, add one!</p>
    </section>
    <section class="transcript-section" aria-label="Video transcript">
      <div class="transcript-header">
        <h2>Transcript</h2>
        <button id="copy-transcript" class="copy-btn" aria-label="Copy transcript">Copy</button>
      </div>
      <ul id="transcript" class="transcript-list"></ul>
      <p id="transcript-message" class="transcript-message"></p>
    </section>
  </main>
  <script src="script.js"></script>
