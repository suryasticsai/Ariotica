<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; manifest-src 'self';">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ariotica Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HIb6+1L9gq6a7k6R9a9p6G6V9p5h6V6K3N9T9qv0T" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js" defer integrity="sha384-EjEsUfA/5AUp6AOIxGF9AopVVVwLwWKoPCOZPsblbSOTPiaTUOkSxL5rKNN5Vvd3" crossorigin="anonymous"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="theme-color" content="hsl(147, 70%, 50%)">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light" x-data="{open:false}">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">MyApp</a>
        <button class="navbar-toggler" type="button" @click="open = !open" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" :class="{'show': open}" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          </ul>
        </div>
      </div>
    </nav>
  <div class="device">
    <header class="app-header glass">
      <h1 class="app-title">Ariotica<span class="watermark" aria-hidden="true"></span></h1>
    </header>
    <main id="viewport" class="viewport">
      <section id="home" class="pane active">
        <div class="chart glass">
          <canvas id="chartCanvas" width="300" height="200" aria-label="Glassmorphic chart placeholder"></canvas>
        </div>
        <p class="empty-state" hidden>No data available. Add items to see the chart.</p>
      </section>
      <section id="settings" class="pane" hidden>
        <h2>Settings</h2>
        <p>Settings content goes here.</p>
      </section>
      <section id="about" class="pane" hidden>
        <h2>About</h2>
        <p>About this dashboard.</p>
      </section>
    </main>
    <nav class="bottom-dock glass">
      <button class="nav-btn" data-target="home" aria-label="Home" aria-current="page"><i class="fa-solid fa-house"></i></button>
      <button class="nav-btn" data-target="settings" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
      <button class="fab" aria-label="Add" title="Add"><i class="fa-solid fa-plus"></i></button>
      <button class="nav-btn" data-target="about" aria-label="About"><i class="fa-solid fa-circle-info"></i></button>
      <button class="nav-btn" aria-label="Profile"><i class="fa-solid fa-user"></i></button>
    </nav>
    <div class="home-indicator"></div>
  </div>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>document.addEventListener("alpine:init", () => { console.log("Alpine.js initialized"); });</script>

<div class='toast-container'></div>

<!-- Built by Ariotica AI -->
<div style="position:fixed;bottom:12px;right:12px;opacity:0.35;font-size:11px;font-family:monospace;color:white;pointer-events:none;z-index:9999;">⚡ Ariotica</div>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
</html>
